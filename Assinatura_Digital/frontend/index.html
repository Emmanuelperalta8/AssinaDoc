<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AssinaDoc</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f9f9f7;
    --fg: #111;
    --muted: #888;
    --border: #e0e0dc;
    --accent: #111;
    --success: #1a7a4a;
    --danger: #c0392b;
    --radius: 6px;
    --mono: 'DM Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  #root { max-width: 480px; margin: 0 auto; padding: 48px 24px 80px; }

  /* NAV */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 48px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .logo { font-family: var(--mono); font-size: 13px; font-weight: 500; letter-spacing: 0.04em; }
  .nav-links { display: flex; gap: 4px; }
  .nav-btn {
    background: none; border: none; cursor: pointer;
    font-family: var(--sans); font-size: 13px;
    color: var(--muted); padding: 4px 10px; border-radius: var(--radius);
    transition: color 0.15s, background 0.15s;
  }
  .nav-btn:hover { color: var(--fg); background: var(--border); }
  .nav-btn.active { color: var(--fg); font-weight: 500; }
  .user-tag {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    border: 1px solid var(--border); padding: 3px 8px; border-radius: 99px;
  }

  /* HEADINGS */
  h1 { font-size: 22px; font-weight: 500; margin-bottom: 6px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 32px; }

  /* FORM */
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
          text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  input, textarea {
    width: 100%; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 9px 12px; font-family: var(--sans); font-size: 14px;
    background: #fff; color: var(--fg); outline: none;
    transition: border-color 0.15s;
  }
  input:focus, textarea:focus { border-color: var(--fg); }
  textarea { min-height: 120px; resize: vertical; font-family: var(--mono); font-size: 13px; }

  /* BUTTONS */
  .btn {
    display: block; width: 100%; padding: 10px 16px;
    border-radius: var(--radius); font-family: var(--sans); font-size: 14px;
    font-weight: 500; cursor: pointer; border: none; text-align: center;
    transition: opacity 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .btn-primary { background: var(--fg); color: var(--bg); }
  .btn-primary:hover:not(:disabled) { opacity: 0.85; }
  .btn-ghost {
    background: none; color: var(--muted); border: 1px solid var(--border);
    margin-top: 8px;
  }
  .btn-ghost:hover:not(:disabled) { color: var(--fg); border-color: var(--fg); }

  /* TABS */
  .tabs { display: flex; gap: 0; margin-bottom: 28px; border-bottom: 1px solid var(--border); }
  .tab {
    background: none; border: none; cursor: pointer; font-family: var(--sans);
    font-size: 13px; color: var(--muted); padding: 8px 16px 10px;
    border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.15s;
  }
  .tab.active { color: var(--fg); border-bottom-color: var(--fg); font-weight: 500; }
  .tab:hover { color: var(--fg); }

  /* RESULT BOXES */
  .box {
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-top: 20px; background: #fff;
  }
  .box-label { font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
               text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: flex-start;
         padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .row:last-child { border-bottom: none; }
  .row-key { color: var(--muted); }
  .row-val { font-family: var(--mono); font-size: 11px; max-width: 58%;
             word-break: break-all; text-align: right; }

  .mono-id {
    font-family: var(--mono); font-size: 11px; background: #f2f2f0;
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 8px 12px; word-break: break-all; display: flex;
    justify-content: space-between; align-items: flex-start; gap: 8px; margin-top: 12px;
  }
  .copy-btn {
    background: none; border: none; cursor: pointer; font-family: var(--mono);
    font-size: 10px; color: var(--muted); white-space: nowrap; padding: 0;
  }
  .copy-btn:hover { color: var(--fg); }

  /* BADGE */
  .badge {
    display: inline-block; font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 99px; margin-bottom: 12px;
  }
  .badge-valid { background: #e6f4ed; color: var(--success); }
  .badge-invalid { background: #fbeaea; color: var(--danger); }

  /* SIG LIST */
  .sig-item {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px;
    margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s;
    background: #fff;
  }
  .sig-item:hover { border-color: var(--fg); }
  .sig-item-id { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 4px; }
  .sig-item-text { font-size: 13px; white-space: nowrap; overflow: hidden;
                   text-overflow: ellipsis; margin-bottom: 3px; }
  .sig-item-date { font-size: 11px; color: var(--muted); }

  /* DIVIDER */
  .divider { text-align: center; color: var(--muted); font-size: 12px; margin: 14px 0;
             display: flex; align-items: center; gap: 12px; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* TOAST */
  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(60px);
    background: var(--fg); color: var(--bg); font-size: 13px; font-family: var(--sans);
    padding: 8px 16px; border-radius: var(--radius); transition: transform 0.25s ease;
    z-index: 999; white-space: nowrap;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.err { background: var(--danger); }

  .spinner {
    display: inline-block; width: 12px; height: 12px; vertical-align: middle;
    border: 1.5px solid rgba(255,255,255,0.3); border-top-color: currentColor;
    border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px;
  }
  .spinner-dark { border-color: rgba(0,0,0,0.15); border-top-color: var(--fg); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .mt8 { margin-top: 8px; }
  .mt16 { margin-top: 16px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 32px 0; }
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const API = 'http://localhost:3001';

// ── API helper ───────────────────────────────────────────────
async function api(method, path, body, token) {
  try {
    const res = await fetch(API + path, {
      method,
      headers: {
        'Content-Type': 'application/json',
        ...(token ? { Authorization: 'Bearer ' + token } : {}),
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    return { ok: res.ok, status: res.status, data: await res.json() };
  } catch {
    return { ok: false, data: { error: 'Servidor indisponível. Inicie o backend.' } };
  }
}

function fmt(s) { return new Date(s).toLocaleString('pt-BR'); }
function copyText(t) { navigator.clipboard.writeText(t); }

// ── Toast ────────────────────────────────────────────────────
let toastTimer;
function toast(msg, err = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show${err ? ' err' : ''}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.className = '', 2800);
}

// ── Components ───────────────────────────────────────────────

function Spinner({ dark }) {
  return <span className={`spinner${dark ? ' spinner-dark' : ''}`} />;
}

function LoginPage({ onLogin, onGoRegister }) {
  const [user, setUser] = useState('');
  const [pass, setPass] = useState('');
  const [loading, setLoading] = useState(false);

  async function submit() {
    if (!user || !pass) return toast('Preencha todos os campos.', true);
    setLoading(true);
    const r = await api('POST', '/login', { username: user, password: pass });
    setLoading(false);
    if (r.ok) { toast('Bem-vindo, ' + r.data.username + '!'); onLogin(r.data); }
    else toast(r.data.error || 'Credenciais inválidas.', true);
  }

  return (
    <>
      <h1>Entrar</h1>
      <p className="sub">Acesse sua área de assinatura digital.</p>
      <div className="field">
        <label>Usuário</label>
        <input value={user} onChange={e => setUser(e.target.value)}
          placeholder="seu_usuario" onKeyDown={e => e.key === 'Enter' && submit()} />
      </div>
      <div className="field">
        <label>Senha</label>
        <input type="password" value={pass} onChange={e => setPass(e.target.value)}
          placeholder="••••••••" onKeyDown={e => e.key === 'Enter' && submit()} />
      </div>
      <button className="btn btn-primary" onClick={submit} disabled={loading}>
        {loading && <Spinner />} Entrar
      </button>
      <div className="divider">ou</div>
      <button className="btn btn-ghost" onClick={onGoRegister}>Criar conta</button>
    </>
  );
}

function RegisterPage({ onSuccess, onGoLogin }) {
  const [user, setUser] = useState('');
  const [pass, setPass] = useState('');
  const [loading, setLoading] = useState(false);

  async function submit() {
    if (!user || !pass) return toast('Preencha todos os campos.', true);
    setLoading(true);
    const r = await api('POST', '/register', { username: user, password: pass });
    setLoading(false);
    if (r.ok) { toast('Conta criada! Par RSA-2048 gerado.'); setTimeout(onSuccess, 1200); }
    else toast(r.data.error || 'Erro no cadastro.', true);
  }

  return (
    <>
      <h1>Criar conta</h1>
      <p className="sub">Um par de chaves RSA-2048 será gerado para você.</p>
      <div className="field">
        <label>Usuário</label>
        <input value={user} onChange={e => setUser(e.target.value)} placeholder="seu_usuario" />
      </div>
      <div className="field">
        <label>Senha</label>
        <input type="password" value={pass} onChange={e => setPass(e.target.value)} placeholder="••••••••" />
      </div>
      <button className="btn btn-primary" onClick={submit} disabled={loading}>
        {loading && <Spinner />} Cadastrar
      </button>
      <div className="divider">já tem conta?</div>
      <button className="btn btn-ghost" onClick={onGoLogin}>Entrar</button>
    </>
  );
}

function SignPage({ token, onVerify }) {
  const [tab, setTab] = useState('new');
  const [text, setText] = useState('');
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);
  const [sigs, setSigs] = useState(null);

  async function sign() {
    if (!text.trim()) return toast('Digite o texto a assinar.', true);
    setLoading(true);
    const r = await api('POST', '/sign', { text: text.trim() }, token);
    setLoading(false);
    if (r.ok) { setResult(r.data); toast('Documento assinado!'); }
    else toast(r.data.error || 'Erro ao assinar.', true);
  }

  async function loadSigs() {
    setSigs(null);
    const r = await api('GET', '/my-signatures', null, token);
    if (r.ok) setSigs(r.data);
  }

  useEffect(() => { if (tab === 'list') loadSigs(); }, [tab]);

  return (
    <>
      <h1>Assinar</h1>
      <p className="sub">Texto assinado com sua chave privada RSA-2048.</p>
      <div className="tabs">
        <button className={`tab${tab === 'new' ? ' active' : ''}`} onClick={() => { setTab('new'); setResult(null); }}>
          Novo
        </button>
        <button className={`tab${tab === 'list' ? ' active' : ''}`} onClick={() => setTab('list')}>
          Histórico
        </button>
      </div>

      {tab === 'new' && (
        <>
          <div className="field">
            <label>Texto</label>
            <textarea value={text} onChange={e => setText(e.target.value)}
              placeholder="Digite o conteúdo do documento..." />
          </div>
          <button className="btn btn-primary" onClick={sign} disabled={loading}>
            {loading && <Spinner />} Assinar
          </button>

          {result && (
            <div className="box mt16">
              <div className="box-label">Assinatura gerada</div>
              <div className="mono-id">
                <span>{result.signatureId}</span>
                <button className="copy-btn" onClick={() => { copyText(result.signatureId); toast('ID copiado!'); }}>
                  copiar
                </button>
              </div>
              <div className="row mt8"><span className="row-key">Algoritmo</span><span className="row-val">{result.algorithm}</span></div>
              <div className="row"><span className="row-key">Hash SHA-256</span><span className="row-val">{result.hash?.slice(0, 20)}…</span></div>
              <div className="row"><span className="row-key">Criado em</span><span className="row-val">{fmt(result.createdAt)}</span></div>
              <button className="btn btn-ghost mt8" onClick={() => onVerify(result.signatureId)}>
                → Verificar esta assinatura
              </button>
            </div>
          )}
        </>
      )}

      {tab === 'list' && (
        <>
          {sigs === null && <div className="empty"><Spinner dark />  Carregando...</div>}
          {sigs?.length === 0 && <div className="empty">Nenhuma assinatura ainda.</div>}
          {sigs?.map(s => (
            <div key={s.id} className="sig-item" onClick={() => onVerify(s.id)}>
              <div className="sig-item-id">{s.id}</div>
              <div className="sig-item-text">{s.textContent}</div>
              <div className="sig-item-date">{fmt(s.createdAt)}</div>
            </div>
          ))}
        </>
      )}
    </>
  );
}

function VerifyPage({ initialId }) {
  const [tab, setTab] = useState('id');
  const [id, setId] = useState(initialId || '');
  const [manualUser, setManualUser] = useState('');
  const [manualText, setManualText] = useState('');
  const [manualSig, setManualSig] = useState('');
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);

  useEffect(() => { if (initialId) setId(initialId); }, [initialId]);

  async function verifyById() {
    if (!id.trim()) return toast('Informe o ID.', true);
    setLoading(true);
    const r = await api('GET', '/verify/' + id.trim());
    setLoading(false);
    setResult({ ...r.data, found: r.ok });
  }

  async function verifyManual() {
    if (!manualUser || !manualText || !manualSig)
      return toast('Preencha todos os campos.', true);
    setLoading(true);
    const r = await api('POST', '/verify/manual', {
      username: manualUser, text: manualText, signature: manualSig,
    });
    setLoading(false);
    setResult(r.data);
  }

  return (
    <>
      <h1>Verificar</h1>
      <p className="sub">Rota pública — qualquer pessoa pode verificar.</p>
      <div className="tabs">
        <button className={`tab${tab === 'id' ? ' active' : ''}`}
          onClick={() => { setTab('id'); setResult(null); }}>Por ID</button>
        <button className={`tab${tab === 'manual' ? ' active' : ''}`}
          onClick={() => { setTab('manual'); setResult(null); }}>Manual</button>
      </div>

      {tab === 'id' && (
        <>
          <div className="field">
            <label>ID da assinatura</label>
            <input value={id} onChange={e => setId(e.target.value)}
              placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
              style={{ fontFamily: 'var(--mono)', fontSize: 12 }} />
          </div>
          <button className="btn btn-primary" onClick={verifyById} disabled={loading}>
            {loading && <Spinner />} Verificar
          </button>
        </>
      )}

      {tab === 'manual' && (
        <>
          <div className="field">
            <label>Usuário signatário</label>
            <input value={manualUser} onChange={e => setManualUser(e.target.value)} placeholder="nome_do_usuario" />
          </div>
          <div className="field">
            <label>Texto original</label>
            <textarea value={manualText} onChange={e => setManualText(e.target.value)}
              placeholder="Cole o texto original..." />
          </div>
          <div className="field">
            <label>Assinatura (base64)</label>
            <textarea value={manualSig} onChange={e => setManualSig(e.target.value)}
              placeholder="Cole a assinatura..." style={{ minHeight: 72 }} />
          </div>
          <button className="btn btn-primary" onClick={verifyManual} disabled={loading}>
            {loading && <Spinner />} Verificar
          </button>
        </>
      )}

      {result && (
        <div className="box mt16">
          <span className={`badge ${result.valid ? 'badge-valid' : 'badge-invalid'}`}>
            {result.valid ? '✓ Válida' : '✗ Inválida'}
          </span>
          {result.error && <p style={{ color: 'var(--muted)', fontSize: 13 }}>{result.error}</p>}
          {result.signer && <div className="row"><span className="row-key">Signatário</span><span className="row-val">{result.signer}</span></div>}
          {result.algorithm && <div className="row"><span className="row-key">Algoritmo</span><span className="row-val">{result.algorithm}</span></div>}
          {result.createdAt && <div className="row"><span className="row-key">Assinado em</span><span className="row-val">{fmt(result.createdAt)}</span></div>}
          {result.verifiedAt && <div className="row"><span className="row-key">Verificado em</span><span className="row-val">{fmt(result.verifiedAt)}</span></div>}
          {result.textHash && <div className="row"><span className="row-key">Hash SHA-256</span><span className="row-val">{result.textHash.slice(0, 20)}…</span></div>}
        </div>
      )}
    </>
  );
}

// ── App ──────────────────────────────────────────────────────
function App() {
  const [page, setPage] = useState(() => localStorage.getItem('token') ? 'sign' : 'login');
  const [token, setToken] = useState(() => localStorage.getItem('token') || '');
  const [username, setUsername] = useState(() => localStorage.getItem('username') || '');
  const [verifyId, setVerifyId] = useState('');

  function onLogin(data) {
    setToken(data.token);
    setUsername(data.username);
    localStorage.setItem('token', data.token);
    localStorage.setItem('username', data.username);
    setPage('sign');
  }

  function logout() {
    setToken(''); setUsername('');
    localStorage.removeItem('token');
    localStorage.removeItem('username');
    setPage('login');
  }

  function goVerify(id) {
    setVerifyId(id);
    setPage('verify');
  }

  const loggedIn = !!token;

  return (
    <>
      <nav>
        <span className="logo">AssinaDoc</span>
        <div className="nav-links">
          {loggedIn ? (
            <>
              <button className={`nav-btn${page === 'sign' ? ' active' : ''}`} onClick={() => setPage('sign')}>Assinar</button>
              <button className={`nav-btn${page === 'verify' ? ' active' : ''}`} onClick={() => setPage('verify')}>Verificar</button>
              <button className="nav-btn" onClick={logout}>Sair</button>
            </>
          ) : (
            <>
              <button className={`nav-btn${page === 'login' ? ' active' : ''}`} onClick={() => setPage('login')}>Entrar</button>
              <button className={`nav-btn${page === 'register' ? ' active' : ''}`} onClick={() => setPage('register')}>Cadastro</button>
              <button className={`nav-btn${page === 'verify' ? ' active' : ''}`} onClick={() => setPage('verify')}>Verificar</button>
            </>
          )}
        </div>
        {loggedIn && <span className="user-tag">{username}</span>}
      </nav>

      {page === 'login' && <LoginPage onLogin={onLogin} onGoRegister={() => setPage('register')} />}
      {page === 'register' && <RegisterPage onSuccess={() => setPage('login')} onGoLogin={() => setPage('login')} />}
      {page === 'sign' && loggedIn && <SignPage token={token} onVerify={goVerify} />}
      {page === 'verify' && <VerifyPage initialId={verifyId} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
